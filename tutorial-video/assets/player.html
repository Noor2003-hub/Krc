<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070b1f;font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;width:1920px;height:1080px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(7,11,31,0) 45%,rgba(7,11,31,.55) 100%)}
#grain{position:absolute;inset:0;width:1920px;height:1080px;opacity:.07;mix-blend-mode:overlay}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#win{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.18)}
#bar{height:44px;background:#f1f3f7;border-bottom:1px solid #e3e6ec;display:flex;align-items:center;padding:0 16px;gap:8px;position:relative}
#bar i{width:12px;height:12px;border-radius:50%;display:block}
#url{position:absolute;left:50%;transform:translateX(-50%);width:520px;height:28px;border-radius:8px;background:#fff;border:1px solid #e3e6ec;
 display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;color:#475467;white-space:nowrap;overflow:hidden}
#content{position:absolute;left:0;top:44px;transform-origin:0 0;overflow:hidden}
#layers{position:absolute;inset:0;z-index:0}
.layer{position:absolute;inset:0}
.layer img{position:absolute;left:0;top:0}
.typed{position:absolute;border-radius:6px;white-space:pre;overflow:hidden}
.typed.area{white-space:normal}
.caret{display:inline-block;width:.09em;height:1.15em;vertical-align:-.2em;margin-left:1px}
#spot,#press,#ripple{position:absolute;pointer-events:none;display:none}
#press{background:rgba(0,0,0,.14)}
#ripple{border-radius:50%;border-style:solid}
#cursor{position:absolute;left:0;top:0;transform-origin:0 0;width:30px;height:30px;z-index:5}
#cursor svg{filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.glass{background:rgba(12,16,38,.62);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 40px rgba(0,0,0,.35);color:#fff}
#step{position:absolute;top:24px;height:52px;border-radius:26px;display:flex;align-items:center;gap:14px;padding:0 24px 0 8px}
#step .num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
#step small{font-size:14px;opacity:.65;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#step b{font-size:21px;font-weight:600;display:inline-block}
#sub{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:1300px;border-radius:14px;padding:12px 26px;font-size:27px;line-height:1.35;font-weight:500;text-align:center}
.card{position:absolute;left:50%;top:50%;width:1100px;border-radius:32px;padding:70px 80px;text-align:center}
.card .lg{width:84px;height:84px;border-radius:24px;margin:0 auto 34px;background-size:cover;background-position:center}
.card .lg.img{width:auto;height:110px;border-radius:0;background:none!important;box-shadow:none!important}
.card .lg.img img{height:110px}
.card h1{font-size:82px;letter-spacing:-.035em;line-height:1.05}
.card p{font-size:30px;opacity:.8;margin-top:20px;line-height:1.35}
.card .chip{display:inline-block;margin-top:34px;padding:9px 20px;border-radius:30px;background:rgba(255,255,255,.12);font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
#fade{position:absolute;inset:0;background:#000;opacity:0}
</style></head>
<body>
<canvas id="bg" width="320" height="180"></canvas><div id="vig"></div><canvas id="grain" width="960" height="540"></canvas>
<div id="stage"><div id="win">
  <div id="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <div id="url">🔒 <span id="urltext"></span></div></div>
  <div id="content"><div id="layers"></div><div id="spot"></div><div id="press"></div><div id="ripple"></div>
    <div id="cursor"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M3 2l15 10.5-6.6 1.2 3.9 7.4-3 1.6-3.9-7.5L3 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
  </div></div></div>
<div id="step" class="glass"><div class="num" id="stepnum">1</div><div><small id="stepof"></small><br><b id="steptitle"></b></div></div>
<div id="sub" class="glass"></div>
<div id="intro" class="card glass"><div class="lg"></div><h1 id="ititle"></h1><p id="isub"></p><div class="chip" id="ichip">Step-by-step guide</div></div>
<div id="outro" class="card glass"><div class="lg"></div><h1 id="otitle"></h1><p id="osub"></p></div>
<div id="fade"></div>
<script>
const $ = id => document.getElementById(id);
let TL, S, IW, IH, K, WX, WY, WW, WH, ACC;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = u => (u = clamp(u, 0, 1)) < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2;
const easeOut = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, u) => a + (b - a) * u;
const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)).join(','); };

// ---------- liquid background ----------
const bg = $('bg').getContext('2d');
let BLOBS = [];
const SPEEDS = [[.17,.23,0],[.13,.19,1.7],[.21,.14,3.1],[.11,.17,4.4],[.19,.12,5.6],[.15,.21,2.3]];
function drawBg(t){
  bg.fillStyle = '#070b1f'; bg.fillRect(0, 0, 320, 180);
  BLOBS.forEach(([c, w1, w2, p], i) => {
    const x = 160 + 125*Math.sin(t*w1 + p) + 30*Math.sin(t*w2*1.7 + i);
    const y = 90 + 70*Math.cos(t*w2 + p*1.3) + 18*Math.cos(t*w1*2.1 + i);
    const r = 95 + 28*Math.sin(t*(w1 + w2) + p);
    const g = bg.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${c},.75)`); g.addColorStop(.5, `rgba(${c},.32)`); g.addColorStop(1, `rgba(${c},0)`);
    bg.fillStyle = g; bg.fillRect(0, 0, 320, 180);
  });
}
(function grain(){ const g = $('grain').getContext('2d'), d = g.createImageData(960, 540);
  for (let i = 0; i < d.data.length; i += 4){ const v = Math.random()*255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; } g.putImageData(d, 0, 0); })();

// sample the field's background colour from the screenshot (median of points just inside its edges)
function sampleBg(img, r){
  const c = document.createElement('canvas'); c.width = IW; c.height = IH; const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const pts = [[r.x + r.w - 8, r.y + 6], [r.x + r.w - 8, r.y + r.h - 7], [r.x + r.w*.75, r.y + 6], [r.x + r.w*.75, r.y + r.h - 7], [r.x + r.w - 8, r.y + r.h/2]];
  const px = pts.map(([a, b]) => Array.from(x.getImageData(Math.round(a), Math.round(b), 1, 1).data.slice(0, 3)));
  px.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
  const m = px[2]; return { bg: `rgb(${m})`, dark: (m[0]*.3 + m[1]*.59 + m[2]*.11) < 128 };
}

// ---------- setup ----------
async function init(timeline, images, logo){
  TL = timeline; S = TL.scenes;
  const pal = TL.palette || ['#4f46e5', '#06b6d4', '#a855f7', '#ec4899', '#3b82f6', '#14b8a6'];
  BLOBS = SPEEDS.map((s, i) => [hex(pal[i % pal.length]), ...s]);
  ACC = TL.accent || ['#6366f1', '#22d3ee'];
  const grad = `linear-gradient(135deg,${ACC[0]},${ACC[1]})`;
  document.querySelectorAll('.card .lg').forEach(e => { if (logo){ e.classList.add('img'); e.innerHTML = `<img src="${logo}">`; } else { e.style.background = grad; e.style.boxShadow = `0 12px 40px ${ACC[0]}99`; } });
  $('stepnum').style.background = grad;
  $('ititle').textContent = TL.title || ''; $('isub').textContent = TL.subtitle || ''; $('ichip').textContent = TL.chip || 'Step-by-step guide';
  $('otitle').textContent = TL.outro_title || "You're all set!"; $('osub').textContent = TL.outro_sub || '';
  // load images, size the browser window to the screenshot aspect ratio
  const els = {};
  for (const [name, src] of Object.entries(images)){ const im = new Image(); im.src = src; await im.decode(); els[name] = im; IW = im.naturalWidth; IH = im.naturalHeight; }
  K = Math.min(1344 / IW, 840 / IH); WW = IW*K; WH = IH*K + 44; WX = (1920 - WW)/2; WY = 92 + (840 - IH*K)/2;
  Object.assign($('win').style, {left: WX + 'px', top: WY + 'px', width: WW + 'px', height: WH + 'px'});
  Object.assign($('content').style, {width: IW + 'px', height: IH + 'px', transform: `scale(${K})`});
  $('step').style.left = WX + 'px';
  S.forEach((sc, i) => {
    const L = document.createElement('div'); L.className = 'layer'; L.id = 'L' + i;
    const im = els[sc.image].cloneNode(); im.style.width = IW + 'px'; im.style.height = IH + 'px'; L.appendChild(im);
    sc.beats.forEach((b, j) => { b.rect = b.target || null;
      if (b.do === 'type'){ const r = b.rect, area = b.multiline ?? (r.h > 70*IW/1280);
        const fs = b.font_size || clamp(Math.round(r.h*(area ? .16 : .36)), 12*IW/1280, 40*IW/1280);
        const col = sampleBg(els[sc.image], r), padX = b.pad_x || Math.max(10, r.h*.3);
        const d = document.createElement('div'); d.className = 'typed' + (area ? ' area' : ''); d.id = `T${i}_${j}`;
        Object.assign(d.style, {left: r.x + 2 + 'px', top: r.y + 2 + 'px', width: r.w - 4 + 'px', height: r.h - 4 + 'px', fontSize: fs + 'px',
          background: b.field_bg || col.bg, color: b.text_color || (col.dark ? '#f2f4f7' : '#101828'),
          padding: area ? `${fs*.7}px ${padX - 2}px` : `0 ${padX - 2}px`, lineHeight: area ? '1.45' : (r.h - 4) + 'px', borderRadius: (b.radius ?? Math.min(8, r.h/5)) + 'px'});
        L.appendChild(d); } });
    $('layers').appendChild(L);
  });
  buildCamera(); buildCursor();
  await document.fonts.ready;
}

// ---------- camera ----------
let CAM = [];
function camFor(b){
  if (!b || !b.zoom || !b.rect) return {s: 1, tx: 0, ty: 0};
  const s = b.zoom, X = WX + K*(b.rect.x + b.rect.w/2), Y = WY + 44 + K*(b.rect.y + b.rect.h/2);
  let tx = 960 - s*X, ty = 560 - s*Y;
  const L = tx + s*WX, Wd = s*WW, T = ty + s*WY, Hd = s*WH;
  const cl = (v, sz, full) => sz <= full - 40 ? clamp(v, 20, full - 20 - sz) : clamp(v, full - sz, 0);
  tx += cl(L, Wd, 1920) - L; ty += cl(T, Hd, 1080) - T;
  return {s, tx, ty};
}
const mix = (a, b, u) => ({s: lerp(a.s, b.s, u), tx: lerp(a.tx, b.tx, u), ty: lerp(a.ty, b.ty, u)});
function buildCamera(){
  const kf = [];
  S.forEach(sc => { kf.push({t: sc.start, to: camFor(null)}); sc.beats.forEach(b => kf.push({t: b.start, to: camFor(b)})); });
  kf.push({t: TL.outro.start, to: camFor(null)});
  let cur = {s: 1, tx: 0, ty: 0};
  kf.forEach((k, i) => { if (i) { const p = kf[i-1]; cur = mix(p.from, p.to, ease((k.t - p.t)/1.2)); } k.from = cur; });
  CAM = kf;
}
function camAt(t){ let k = CAM[0]; for (const c of CAM) if (c.t <= t) k = c; return mix(k.from, k.to, ease((t - k.t)/1.2)); }

// ---------- cursor ----------
let MOVES = [];
function buildCursor(){
  let pos = {x: IW*.78, y: IH*.8};
  S.forEach(sc => sc.beats.forEach(b => {
    if (!['type', 'click', 'point'].includes(b.do)) return;
    const r = b.rect, to = b.do === 'type' ? {x: r.x + Math.min(r.h*2, r.w*.3), y: r.y + Math.min(r.h/2, 26*IW/1280)} : {x: r.x + r.w/2, y: r.y + r.h/2};
    b.point = to; MOVES.push({a: b.click_at - 1.0, b: b.click_at - 0.08, from: pos, to}); pos = to;
  }));
}
function cursorAt(t){
  let p = MOVES.length ? MOVES[0].from : {x: IW*.78, y: IH*.8};
  for (const m of MOVES){ if (t >= m.b) p = m.to; else if (t > m.a){ const u = ease((t - m.a)/(m.b - m.a));
      const dx = m.to.x - m.from.x, dy = m.to.y - m.from.y, arc = Math.sin(Math.PI*u)*0.12;
      p = {x: m.from.x + dx*u - dy*arc, y: m.from.y + dy*u + dx*arc}; break; } else break; }
  return p;
}

// ---------- render one frame ----------
function render(t){
  drawBg(t);
  const intro = TL.intro, outro = TL.outro, s0 = S[0].start;
  const iu = easeOut(ramp(t, .3, 1.3)), iv = ease(ramp(t, intro.end - .7, intro.end));
  $('intro').style.opacity = iu*(1 - iv);
  $('intro').style.transform = `translate(-50%,-50%) translateY(${(1-iu)*40}px) scale(${1 - iv*.06})`;
  const ou = easeOut(ramp(t, outro.start + .5, outro.start + 1.5));
  $('outro').style.opacity = ou; $('outro').style.transform = `translate(-50%,-50%) translateY(${(1-ou)*40}px)`;
  const wi = easeOut(ramp(t, s0 - .3, s0 + .8)), wo = ease(ramp(t, outro.start, outro.start + .8));
  $('win').style.opacity = wi*(1 - wo);
  $('win').style.transform = `translateY(${(1-wi)*140 + wo*-80}px) scale(${.92 + .08*wi - wo*.06})`;
  const cam = camAt(t), inv = 1/(K*cam.s);
  $('stage').style.transform = `translate(${cam.tx}px,${cam.ty}px) scale(${cam.s})`;
  let si = -1; S.forEach((sc, i) => { if (t >= sc.start) si = i; });
  const scene = S[Math.max(si, 0)];
  S.forEach((sc, i) => { const L = $('L' + i);
    L.style.display = (i === Math.max(si, 0) || i === si - 1) ? 'block' : 'none';
    L.style.opacity = i === si ? easeOut(ramp(t, sc.start, sc.start + .5)) : 1; L.style.zIndex = i; });
  $('urltext').textContent = scene.url || '';
  $('url').style.visibility = scene.url ? 'visible' : 'hidden';
  // step pill
  const sIn = easeOut(ramp(t, scene.start, scene.start + .6));
  $('step').style.opacity = (t >= s0 - .2 ? 1 : 0) * easeOut(ramp(t, s0, s0 + .7)) * (1 - ease(ramp(t, outro.start - .2, outro.start + .3)));
  $('stepnum').textContent = scene.n; $('stepof').textContent = `Step ${scene.n} of ${S.length}`; $('steptitle').textContent = scene.step;
  const sb = $('steptitle'); sb.style.opacity = sIn; sb.style.transform = `translateY(${(1-sIn)*10}px)`;
  // typed fields
  S.forEach((sc, i) => sc.beats.forEach((b, j) => { if (b.do !== 'type') return; const d = $(`T${i}_${j}`);
    const focused = t >= b.click_at && t < b.end && i === si, on = t >= b.type_start;
    if (!on && !focused){ d.style.display = 'none'; return; }
    d.style.display = 'block';
    const n = Math.round(b.text.length * ramp(t, b.type_start, b.type_end));
    const blink = Math.floor((t - b.click_at) * 2.2) % 2 === 0 || (t > b.type_start && t < b.type_end);
    const bgc = d.dataset.bg || (d.dataset.bg = d.style.background);
    d.style.background = on ? bgc : 'transparent';
    d.textContent = on ? b.text.slice(0, n) : '';
    if (focused && blink) d.insertAdjacentHTML('beforeend', `<span class="caret" style="background:${ACC[0]}"></span>`);
    d.style.boxShadow = focused ? `inset 0 0 0 ${1.5*IW/1280}px ${ACC[0]}, 0 0 0 ${4*IW/1280}px ${ACC[0]}2e` : 'none';
  }));
  let beat = null; if (si >= 0) for (const b of scene.beats) if (t >= b.start && t < b.end) beat = b;
  // spotlight
  const sp = $('spot');
  if (beat && beat.rect && t < outro.start){
    const a = ease(ramp(t, beat.start + .2, beat.start + .7)) * (1 - ease(ramp(t, beat.end - .45, beat.end - .05)));
    const pad = (beat.do === 'spotlight' ? 10 : 6)*IW/1280, r = beat.rect, dim = beat.dim ?? (beat.do === 'spotlight' ? .5 : .32);
    Object.assign(sp.style, {display: 'block', left: r.x - pad + 'px', top: r.y - pad + 'px', width: r.w + 2*pad + 'px', height: r.h + 2*pad + 'px', borderRadius: (beat.radius ?? 10*IW/1280) + 'px',
      boxShadow: `0 0 0 ${3*inv}px rgba(${hex(ACC[0])},${a}), 0 0 ${30*inv}px ${8*inv}px rgba(${hex(ACC[0])},${.45*a}), 0 0 0 ${IW*3}px rgba(8,12,32,${dim*a})`});
  } else sp.style.display = 'none';
  // cursor + click
  const cur = $('cursor');
  const cvis = (si >= 0 ? easeOut(ramp(t, s0 + .3, s0 + 1)) : 0) * (1 - ease(ramp(t, outro.start - .3, outro.start)));
  const p = cursorAt(t);
  let press = 1, clickB = null;
  S.forEach(sc => sc.beats.forEach(b => { if (b.click_at && b.do !== 'point' && t >= b.click_at - .05 && t < b.click_at + .7) clickB = b; }));
  if (clickB){ const dt = t - clickB.click_at; press = dt < 0 ? 1 - .15*ramp(dt, -.05, 0) : 1 - .15*(1 - ramp(dt, .05, .2)); }
  cur.style.opacity = cvis; cur.style.transform = `translate(${p.x - 3*inv}px,${p.y - 2*inv}px) scale(${inv*press})`;
  const rp = $('ripple'), pr = $('press');
  if (clickB && t >= clickB.click_at && cvis > 0){ const u = ramp(t, clickB.click_at, clickB.click_at + .6), R = (12 + 46*easeOut(u)) * inv;
    Object.assign(rp.style, {display: 'block', left: clickB.point.x - R + 'px', top: clickB.point.y - R + 'px', width: 2*R + 'px', height: 2*R + 'px',
      opacity: .9*(1 - u), borderWidth: 3*inv + 'px', borderColor: ACC[0], background: `rgba(${hex(ACC[0])},.18)`});
    if (clickB.do === 'click'){ const r = clickB.rect; Object.assign(pr.style, {display: u < .35 ? 'block' : 'none', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', borderRadius: Math.min(10, r.h/4) + 'px'}); } else pr.style.display = 'none';
  } else { rp.style.display = 'none'; pr.style.display = 'none'; }
  // subtitles
  let say = null, a0 = 0, a1 = 0;
  if (t < intro.end){ say = intro.say; a0 = .9; a1 = intro.end - .3; }
  else if (t >= outro.start){ say = outro.say; a0 = outro.audio_start - .1; a1 = outro.end - 1.2; }
  else if (beat){ say = beat.say; a0 = beat.audio_start - .1; a1 = beat.end - .15; }
  const sv = (TL.subtitles === false || !say) ? 0 : ramp(t, a0, a0 + .2) * (1 - ramp(t, a1 - .2, a1));
  $('sub').style.opacity = sv; if (say && $('sub').textContent !== say) $('sub').textContent = say;
  $('fade').style.opacity = ramp(t, TL.duration - .8, TL.duration);
}
</script></body></html>
